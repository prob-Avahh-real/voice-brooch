; ESP32 变声胸针固件 (ESP-IDF + NimBLE)
; 在 firmware/esp32 目录执行: pio run -e esp32_brooch

[platformio]
default_envs = esp32_brooch
description = Voice Brooch ESP32

[env:esp32_brooch]
platform = espressif32
framework = espidf
board = esp32dev
monitor_speed = 115200
board_build.embed_files =
board_build.partitions = default.csv
build_flags =
    -I ../shared
build_src_filter =
    +<main/>
    +<../shared/>
    -<../test/>
    -<../nrf52/>

[env:esp32_brooch_s3]
extends = env:esp32_brooch
board = esp32-s3-devkitc-1

[env:esp32_brooch_c3]
extends = env:esp32_brooch
board = esp32-c3-devkitm-1

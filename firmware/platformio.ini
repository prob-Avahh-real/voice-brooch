; 变声胸针 — PlatformIO 根配置
; 用法见 firmware/README.md

[platformio]
default_envs = native_test
description = Voice Brooch firmware monorepo

[common]
lib_ldf_mode = off
monitor_speed = 115200

; ---------- 协议单元测试 (Host native) ----------
[env:native_test]
platform = native
build_flags =
    -I shared
    -std=c99
    -Wall
    -Wextra
build_src_filter =
    +<shared/vb_protocol.c>
    +<shared/vb_button.c>
    +<test/native/test_protocol.c>
test_ignore = true

; ---------- nRF52840 + 胸针 PCB overlay (Zephyr) ----------
[env:nrf52840_brooch]
platform = nordicnrf52
board = nrf52840dk_nrf52840
framework = zephyr
board_build.overlay = boards/voice_brooch.overlay
board_build.conf_file = nrf52/prj.conf
build_flags =
    -I shared
    -I nrf52/src
build_src_filter =
    +<nrf52/src/>
    +<shared/>
    -<esp32/>
    -<test/>

; ---------- nRF52840 DK 无 overlay（开发板直连引脚时回退） ----------
[env:nrf52840_dk]
extends = env:nrf52840_brooch
board_build.overlay =
